    ReviewCycle:
      type: object
      description: "A performance review cycle (e.g. Q2 2024, Annual 2024)"
      properties:
        id:
          type: string
          format: uuid
          example: rc1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        name:
          type: string
          example: Annual Performance Review 2024
        type:
          type: string
          enum:
            - annual
            - semi_annual
            - quarterly
            - probation
            - custom
          example: annual
        periodStart:
          type: string
          format: date
          example: "2024-01-01"
        periodEnd:
          type: string
          format: date
          example: "2024-12-31"
        selfReviewDeadline:
          type: string
          format: date
          example: "2025-01-10"
        managerReviewDeadline:
          type: string
          format: date
          example: "2025-01-20"
        status:
          type: string
          enum:
            - draft
            - active
            - in_calibration
            - completed
            - cancelled
          example: active
        participantCount:
          type: integer
          example: 35
        completedCount:
          type: integer
          example: 12
        createdAt:
          type: string
          format: date-time
          example: "2024-12-15T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-12-15T08:00:00Z"
      required:
        - id
        - tenantId
        - name
        - type
        - periodStart
        - periodEnd
        - status
        - createdAt
        - updatedAt
    ReviewCycleListResponse:
      type: object
      description: Paginated list of review cycles
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewCycle"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    ReviewCycleCreateRequest:
      type: object
      description: Payload to create a performance review cycle
      properties:
        name:
          type: string
          example: Annual Performance Review 2024
        type:
          type: string
          enum:
            - annual
            - semi_annual
            - quarterly
            - probation
            - custom
          example: annual
        periodStart:
          type: string
          format: date
          example: "2024-01-01"
        periodEnd:
          type: string
          format: date
          example: "2024-12-31"
        selfReviewDeadline:
          type: string
          format: date
          example: "2025-01-10"
        managerReviewDeadline:
          type: string
          format: date
          example: "2025-01-20"
        participantEmployeeIds:
          type: array
          description: Employee ids to include; omit to include all active employees
          items:
            type: string
            format: uuid
          example: []
      required:
        - name
        - type
        - periodStart
        - periodEnd
        - selfReviewDeadline
        - managerReviewDeadline
    ReviewResult:
      type: object
      description: Individual performance review result for an employee in a cycle
      properties:
        id:
          type: string
          format: uuid
          example: rr1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        cycleId:
          type: string
          format: uuid
          example: rc1a2b3c-d5e6-7890-abcd-ef1234567890
        cycleName:
          type: string
          example: Annual Performance Review 2024
        employeeId:
          type: string
          format: uuid
          example: e1a2b3c4-d5e6-7890-abcd-ef1234567890
        employeeName:
          type: string
          example: John Smith
        reviewerId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        reviewerName:
          type: string
          example: Jane Doe
        selfScore:
          type: number
          format: double
          nullable: true
          description: Self-assessed score (0-100)
          example: 78
        managerScore:
          type: number
          format: double
          nullable: true
          description: Manager-assessed score (0-100)
          example: 82
        finalScore:
          type: number
          format: double
          nullable: true
          description: Calibrated final score (0-100)
          example: 80
        rating:
          type: string
          enum:
            - exceeds_expectations
            - meets_expectations
            - needs_improvement
            - unsatisfactory
          nullable: true
          example: meets_expectations
        selfComment:
          type: string
          nullable: true
          example: I delivered all assigned tasks and mentored two junior developers.
        managerComment:
          type: string
          nullable: true
          example: >-
            John consistently delivers quality work and is a reliable team
            member.
        status:
          type: string
          enum:
            - pending
            - self_submitted
            - manager_submitted
            - finalized
          example: manager_submitted
        createdAt:
          type: string
          format: date-time
          example: "2025-01-05T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-01-18T16:00:00Z"
      required:
        - id
        - tenantId
        - cycleId
        - cycleName
        - employeeId
        - employeeName
        - reviewerId
        - reviewerName
        - status
        - createdAt
        - updatedAt
    ReviewResultListResponse:
      type: object
      description: Paginated list of review results in a cycle
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ReviewResult"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    Permission:
      type: object
      description: A fine-grained permission key
      properties:
        id:
          type: string
          format: uuid
          example: pm1a2b3c-d5e6-7890-abcd-ef1234567890
        key:
          type: string
          description: Namespaced permission key
          example: payroll.view.all
        group:
          type: string
          description: Logical group for UI grouping
          example: Payroll
        description:
          type: string
          example: View payroll records for all employees
      required:
        - id
        - key
        - group
        - description
    Role:
      type: object
      description: A role with a set of permissions assignable to users
      properties:
        id:
          type: string
          format: uuid
          example: ro1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        name:
          type: string
          example: Payroll Manager
        description:
          type: string
          nullable: true
          example: "Can view, calculate, and approve payroll cycles"
        isSystem:
          type: boolean
          description: System roles cannot be deleted
          example: false
        permissionCount:
          type: integer
          example: 12
        permissions:
          type: array
          description: Included when role detail is fetched
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-05T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-05T08:00:00Z"
      required:
        - id
        - tenantId
        - name
        - isSystem
        - permissionCount
        - createdAt
        - updatedAt
    RoleListResponse:
      type: object
      description: Paginated list of roles
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    RoleCreateRequest:
      type: object
      description: Payload to create a custom role
      properties:
        name:
          type: string
          minLength: 2
          example: Payroll Manager
        description:
          type: string
          nullable: true
          example: "Can view, calculate, and approve payroll cycles"
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
          description: List of permission ids to assign initially
          example:
            - pm1a2b3c-d5e6-7890-abcd-ef1234567890
      required:
        - name
    PermissionListResponse:
      type: object
      description: "List of all permissions (non-paginated, used for role configuration UI)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required:
        - data
    RolePermissionsUpdateRequest:
      type: object
      description: Replace the full set of permissions for a role
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
          description: Complete list of permission ids (replaces existing set)
          example:
            - pm1a2b3c-d5e6-7890-abcd-ef1234567890
            - pm2b3c4d-e6f7-8901-bcde-f01234567891
      required:
        - permissionIds
    Report:
      type: object
      description: A report definition or generated report result
      properties:
        id:
          type: string
          format: uuid
          example: rp1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        name:
          type: string
          example: Monthly Payroll Summary
        type:
          type: string
          enum:
            - payroll_summary
            - attendance_summary
            - leave_summary
            - headcount
            - project_utilization
            - performance_distribution
            - custom
          example: payroll_summary
        filters:
          type: object
          description: "Applied filters (period, department, etc.)"
          example:
            periodStart: "2024-06-01"
            periodEnd: "2024-06-30"
            orgUnitId: null
        status:
          type: string
          enum:
            - pending
            - processing
            - ready
            - failed
          example: ready
        downloadUrl:
          type: string
          format: uri
          nullable: true
          description: Signed download URL valid for 15 minutes
          example: "https://storage.example.com/reports/payroll-june-2024.xlsx?token=abc"
        generatedAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-07-02T10:00:00Z"
        requestedBy:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        createdAt:
          type: string
          format: date-time
          example: "2024-07-02T09:55:00Z"
      required:
        - id
        - tenantId
        - name
        - type
        - status
        - requestedBy
        - createdAt
    ReportListResponse:
      type: object
      description: Paginated list of reports
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    ReportRunRequest:
      type: object
      description: Payload to trigger a report generation job
      properties:
        type:
          type: string
          enum:
            - payroll_summary
            - attendance_summary
            - leave_summary
            - headcount
            - project_utilization
            - performance_distribution
            - custom
          example: payroll_summary
        name:
          type: string
          example: Monthly Payroll Summary June 2024
        filters:
          type: object
          description: Report-specific filter parameters
          properties:
            periodStart:
              type: string
              format: date
              nullable: true
              example: "2024-06-01"
            periodEnd:
              type: string
              format: date
              nullable: true
              example: "2024-06-30"
            orgUnitId:
              type: string
              format: uuid
              nullable: true
              example: null
            employeeIds:
              type: array
              items:
                type: string
                format: uuid
              example: []
          example:
            periodStart: "2024-06-01"
            periodEnd: "2024-06-30"
        format:
          type: string
          enum:
            - xlsx
            - csv
            - pdf
          default: xlsx
      required:
        - type
        - name
    UserListResponse:
      type: object
      description: Paginated list of users
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - meta
    UserCreateRequest:
      type: object
      description: Payload used to create a new user by an administrator
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 32
          example: johnsmith
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          minLength: 8
          description: Temporary or initial password
          example: StrongPass!123
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          minLength: 1
          example: Smith
        role:
          type: string
          enum:
            - user
            - admin
          default: user
        isActive:
          type: boolean
          default: true
      required:
        - username
        - email
        - password
        - firstName
        - lastName
    UserUpdateRequest:
      type: object
      description: Partial update payload for an existing user
      properties:
        email:
          $ref: "#/components/schemas/Email"
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          minLength: 1
          example: Smith
        password:
          type: string
          format: password
          minLength: 8
          description: New password; omit to keep current
          example: StrongPass!123
        role:
          type: string
          enum:
            - user
            - admin
        isActive:
          type: boolean
    User:
      type: object
      properties:
        username:
          description: User supplied username
          type: string
          minLength: 4
          example: John78
        firstName:
          description: User first name
          type: string
          minLength: 1
          example: John
        lastName:
          description: User last name
          type: string
          minLength: 1
          example: Smith
        email:
          $ref: "#/components/schemas/Email"
  headers:
    ExpiresAfter:
      description: date in UTC when token expires
      schema:
        type: string
        format: date-time
