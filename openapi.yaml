openapi: 3.0.2
info:
  version: 1.0.0
  title: HRM SaaS API
  termsOfService: "https://example.com/terms/"
  contact:
    name: HRM SaaS Support
    email: contact@example.com
    url: "http://example.com/contact"
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
  x-logo:
    url: "https://redocly.github.io/openapi-template/logo.png"
  description: >
    Production-grade **HRM SaaS** REST API — multi-tenant, role-based, and
    OpenAPI-first.


    ## Modules

    | Tag | Description | |-----|-------------| | Auth | Login, register, token
    refresh, current user | | Organization | Company → BU → Department → Team
    hierarchy | | Employee | Onboarding, profiles, employment contracts | |
    Attendance | Check-in/out, corrections & approvals | | Timesheet | Weekly
    time entries, submit & approve flow | | Payroll | Payroll cycles,
    calculation, approval, payslips | | Project | Project lifecycle & resource
    allocation | | Task | Tasks with status transitions | | Leave | Leave
    requests, balances, policies | | Performance Review | Review cycles and
    results | | RBAC | Roles and fine-grained permissions | | Reporting | Async
    report generation and download |


    ## Authentication

    All endpoints (except `/auth/login` and `/auth/register`) require a `Bearer`
    JWT access token obtained from `/auth/login`.

    ``` Authorization: Bearer <accessToken> ```

    Use `/auth/refresh-token` to renew the access token before expiry.


    ## Pagination

    List endpoints return:

    ```json {
      "data": [...],
      "meta": { "page": 1, "pageSize": 20, "totalItems": 125, "totalPages": 7 }
    } ```

    ## Error format

    ```json {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "One or more fields are invalid",
        "details": [{ "field": "email", "message": "Must be a valid email" }]
      }
    } ```
externalDocs:
  description: Architecture overview and onboarding guide
  url: "https://github.com/example/hrm-saas"
tags:
  - name: Auth
    description: Authentication and token lifecycle
  - name: Organization
    description: Company / BU / Department / Team management
  - name: Employee
    description: "Employee onboarding, profiles and contracts"
  - name: Attendance
    description: "Check-in/out, corrections and approvals"
  - name: Timesheet
    description: "Weekly timesheets, submission and approval"
  - name: Payroll
    description: "Payroll cycles, calculation, lock and payslips"
  - name: Project
    description: Project lifecycle and resource management
  - name: Task
    description: Tasks within projects with status transitions
  - name: Leave
    description: "Leave requests, balances and policies"
  - name: Performance Review
    description: Review cycles and individual results
  - name: RBAC
    description: Roles and fine-grained permission management
  - name: Reporting
    description: Async report generation and download
  - name: User Management
    description: Administrative user management APIs
  - name: User
    description: Legacy user profile operations
  - name: Echo
    description: Example echo operations
servers:
  - url: "http://localhost:3000/api/v1"
    description: Local development
  - url: "https://api.hrm.example.com/v1"
    description: Production
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: User registered and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "400":
          description: Invalid payload
        "409":
          description: Username or email already exists
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with username or email
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid credentials
        "429":
          description: "Too many attempts, try later"
  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRefreshRequest"
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRefreshResponse"
        "401":
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke refresh token
      operationId: logoutUser
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogoutRequest"
      responses:
        "204":
          description: Logout successful
        "401":
          description: Unauthorized
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: >-
        Returns the profile of the authenticated user based on the provided
        access token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Invalid or missing access token
  /organizations:
    get:
      tags:
        - Organization
      summary: List organizational units
      operationId: listOrgUnits
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by unit type
          schema:
            type: string
            enum:
              - company
              - business_unit
              - department
              - team
        - name: parentId
          in: query
          description: Filter by parent org unit id
          schema:
            type: string
            format: uuid
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated list of org units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Organization
      summary: Create organizational unit
      operationId: createOrgUnit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitCreateRequest"
      responses:
        "201":
          description: Org unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/organizations/{orgId}":
    parameters:
      - name: orgId
        in: path
        required: true
        description: Organizational unit ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Organization
      summary: Get organizational unit by id
      operationId: getOrgUnitById
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Org unit detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Organization
      summary: Update organizational unit
      operationId: updateOrgUnit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgUnitUpdateRequest"
      responses:
        "200":
          description: Updated org unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnit"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Organization
      summary: Delete organizational unit (soft delete)
      operationId: deleteOrgUnit
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete unit with active members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/organizations/{orgId}/children":
    parameters:
      - name: orgId
        in: path
        required: true
        description: Parent organizational unit ID
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Organization
      summary: Get direct children of an organizational unit
      operationId: getOrgUnitChildren
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of direct children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgUnitListResponse"
        "404":
          description: Parent org unit not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /employees:
    get:
      tags:
        - Employee
      summary: List employees
      operationId: listEmployees
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: "Search by name, email, or employee code"
          schema:
            type: string
        - name: orgUnitId
          in: query
          description: Filter by department/team
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - probation
              - active
              - on_leave
              - terminated
        - name: workMode
          in: query
          schema:
            type: string
            enum:
              - office
              - remote
              - hybrid
        - name: managerId
          in: query
          description: Filter by direct manager
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated list of employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Employee
      summary: Onboard a new employee
      operationId: createEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeCreateRequest"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/employees/{employeeId}":
    parameters:
      - name: employeeId
        in: path
        required: true
        description: Employee ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Employee
      summary: Get employee by id
      operationId: getEmployeeById
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
        - Employee
      summary: Update employee profile
      operationId: updateEmployee
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdateRequest"
      responses:
        "200":
          description: Updated employee profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeProfile"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Employee
      summary: Terminate / soft-delete employee
      operationId: deleteEmployee
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Employee terminated
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/employees/{employeeId}/contracts":
    parameters:
      - name: employeeId
        in: path
        required: true
        description: Employee ID (UUID)
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Employee
      summary: List contracts for an employee
      operationId: listEmployeeContracts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contract"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Employee
      summary: Add a new contract for an employee
      operationId: createEmployeeContract
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCreateRequest"
      responses:
        "201":
          description: Contract created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Business rule violation (e.g. overlapping contract dates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/check-in:
    post:
      tags:
        - Attendance
      summary: Employee check-in
      operationId: attendanceCheckIn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCheckInRequest"
      responses:
        "201":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Already checked in today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: GPS out of geofence / work mode not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/check-out:
    post:
      tags:
        - Attendance
      summary: Employee check-out
      operationId: attendanceCheckOut
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCheckOutRequest"
      responses:
        "200":
          description: Check-out recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: No active check-in found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/records:
    get:
      tags:
        - Attendance
      summary: List attendance records
      operationId: listAttendanceRecords
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: query
          description: Filter by employee (managers can query team; employees see own)
          schema:
            type: string
            format: uuid
        - name: orgUnitId
          in: query
          description: Filter by department
          schema:
            type: string
            format: uuid
        - name: dateFrom
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2024-06-01"
        - name: dateTo
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: status
          in: query
          schema:
            type: string
            enum:
              - present
              - absent
              - late
              - half_day
              - corrected
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        "200":
          description: Paginated attendance records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /attendance/corrections:
    get:
      tags:
        - Attendance
      summary: List attendance correction requests
      operationId: listAttendanceCorrections
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated correction requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrectionListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Attendance
      summary: Submit attendance correction request
      operationId: createAttendanceCorrection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceCorrectionRequest"
      responses:
        "201":
          description: Correction request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrection"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/attendance/corrections/{correctionId}/approve":
    parameters:
      - name: correctionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Attendance
      summary: Approve an attendance correction request
      operationId: approveAttendanceCorrection
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  nullable: true
                  example: Confirmed with office reception log
      responses:
        "200":
          description: Correction approved and attendance record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrection"
        "404":
          description: Correction request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request is not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  "/attendance/corrections/{correctionId}/reject":
    parameters:
      - name: correctionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Attendance
      summary: Reject an attendance correction request
      operationId: rejectAttendanceCorrection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 5
                  example: No supporting evidence found in security logs
              required:
                - reason
      responses:
        "200":
          description: Correction rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceCorrection"
        "404":
          description: Correction request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request is not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /timesheets:
    get:
      tags:
        - Timesheet
      summary: List timesheets
      operationId: listTimesheets
      security:
        - bearerAuth: []
      parameters:
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - submitted
              - approved
              - rejected
              - locked
        - name: periodStart
          in: query
          schema:
            type: string
            format: date
            example: "2024-06-01"
        - name: periodEnd
          in: query
          schema:
            type: string
            format: date
            example: "2024-06-30"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated timesheets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Timesheet
      summary: Create a timesheet
      operationId: createTimesheet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetCreateRequest"
      responses:
        "201":
          description: Timesheet created as draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timesheet"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Timesheet already exists for this period
          content:
            application/json:
