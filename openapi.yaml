    LeavePolicy:
      type: object
      description: A leave policy defining entitlement rules for a leave type
      properties:
        id:
          type: string
          format: uuid
          example: lp1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        name:
          type: string
          example: Annual Leave
        code:
          type: string
          example: ANNUAL
        type:
          type: string
          enum:
            - annual
            - sick
            - unpaid
            - maternity
            - paternity
            - compensatory
            - other
          example: annual
        daysPerYear:
          type: number
          format: double
          example: 12
        accrualType:
          type: string
          enum:
            - upfront
            - monthly
            - daily
          description: How entitlement is accrued
          example: monthly
        allowCarryOver:
          type: boolean
          example: true
        maxCarryOverDays:
          type: number
          format: double
          nullable: true
          example: 5
        allowNegativeBalance:
          type: boolean
          example: false
        requireApproval:
          type: boolean
          example: true
        minAdvanceDays:
          type: integer
          description: Minimum notice days required before leave start
          example: 3
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T08:00:00Z"
      required:
        - id
        - tenantId
        - name
        - code
        - type
        - daysPerYear
        - accrualType
        - allowCarryOver
        - allowNegativeBalance
        - requireApproval
        - isActive
        - createdAt
        - updatedAt
    LeavePolicyListResponse:
      type: object
