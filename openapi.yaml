          type: string
          format: uuid
          example: lb1a2b3c-d5e6-7890-abcd-ef1234567890
        tenantId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        employeeId:
          type: string
          format: uuid
          example: e1a2b3c4-d5e6-7890-abcd-ef1234567890
        employeeName:
          type: string
          example: John Smith
        policyId:
          type: string
          format: uuid
          example: lp1a2b3c-d5e6-7890-abcd-ef1234567890
        policyName:
          type: string
          example: Annual Leave
        policyCode:
          type: string
          example: ANNUAL
        entitled:
          type: number
          format: double
          description: Total days entitled in the current period
          example: 12
        accrued:
          type: number
          format: double
          description: Days accrued so far this period
          example: 6
        used:
          type: number
          format: double
          description: Days consumed by approved leave
          example: 2
        pending:
          type: number
          format: double
          description: Days requested but not yet approved
          example: 1
        remaining:
          type: number
          format: double
          description: accrued - used - pending
          example: 3
        year:
          type: integer
          example: 2024
      required:
        - id
        - tenantId
        - employeeId
        - employeeName
        - policyId
        - policyName
        - policyCode
        - entitled
        - accrued
        - used
        - pending
        - remaining
        - year
    LeaveBalanceListResponse:
      type: object
      description: List of leave balances for an employee across all policies
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaveBalance"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
