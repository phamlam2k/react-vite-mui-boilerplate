              example: Hello world!
        description: Echo payload
        required: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login
    main_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: "http://example.com/api/oauth/dialog"
          scopes:
            "read:users": read users info
            "write:users": modify or remove users
    api_key:
      type: apiKey
      in: header
      name: api_key
    basic_auth:
      type: http
      scheme: basic
  schemas:
    Email:
      description: User email address
      type: string
      format: email
      example: john.smith@example.com
    AuthRegisterRequest:
      type: object
      description: Registration payload for creating a new account
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 32
          example: johnsmith
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          format: password
          minLength: 8
          description: User password
          example: StrongPass!123
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          minLength: 1
          example: Smith
      required:
        - username
        - email
        - password
        - firstName
        - lastName
    AuthTokens:
      type: object
      description: Access and refresh tokens issued after authentication
      properties:
        accessToken:
          type: string
          description: JWT used for authenticated requests
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived token used to obtain a new access token
          example: dcb29211-7b4e-4a1c-8ccf-4a4b6c8d2a51
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
          example: 3600
        tokenType:
          type: string
          description: Token type indicator
          default: Bearer
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType
    UserProfile:
      type: object
      description: Rich user profile returned by the API
      properties:
        id:
          type: string
          format: uuid
          example: 8b2e7f2d-4fd5-40a0-9e65-7e3d4c9f0f11
        username:
          type: string
          minLength: 4
          example: johnsmith
        email:
          $ref: "#/components/schemas/Email"
        firstName:
          type: string
          minLength: 1
          example: John
        lastName:
          type: string
          minLength: 1
          example: Smith
        role:
          type: string
          description: Role assigned to the user
          enum:
            - user
            - admin
          example: user
        isActive:
          type: boolean
          description: Indicates whether the user account is active
          example: true
        lastLoginAt:
          type: string
          format: date-time
          description: Timestamp of the most recent successful login
          example: "2024-05-10T14:32:10Z"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-05-10T14:32:10Z"
      required:
        - id
        - username
        - email
        - firstName
        - lastName
        - role
        - isActive
        - createdAt
        - updatedAt
    AuthLoginResponse:
      type: object
      description: Tokens and user profile returned after authentication
      properties:
        tokens:
          $ref: "#/components/schemas/AuthTokens"
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - tokens
        - user
    AuthLoginRequest:
      type: object
      description: Credentials used to authenticate a user
      properties:
        usernameOrEmail:
          type: string
          description: Username or email used to login
          minLength: 3
          example: john.smith@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User password
          example: StrongPass!123
      required:
        - usernameOrEmail
        - password
    AuthRefreshRequest:
      type: object
      description: Payload used to obtain a new access token
      properties:
        refreshToken:
          type: string
          description: Valid refresh token issued during login or registration
          example: dcb29211-7b4e-4a1c-8ccf-4a4b6c8d2a51
      required:
        - refreshToken
    AuthRefreshResponse:
      type: object
      description: Tokens returned after refreshing an access token
      properties:
        tokens:
          $ref: "#/components/schemas/AuthTokens"
      required:
        - tokens
    AuthLogoutRequest:
      type: object
      description: Optional payload to revoke a specific refresh token during logout
      properties:
        refreshToken:
          type: string
          description: Refresh token to invalidate (omit to logout all sessions)
          example: dcb29211-7b4e-4a1c-8ccf-4a4b6c8d2a51
    OrgUnit:
      type: object
